# Database configuration
spring.application.name=userservice
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto={SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT configuration
jwt.secret=${SPRING_JWT_SECRET}
jwt.expirationMs=${SPRING_JWT_EXPIRATION_MS}
jwt.refreshExpirationMs=${SPRING_JWT_REFRESH_EXPIRATION_MS}

# Admin user configuration
admin.email=${SPRING_ADMIN_EMAIL}
admin.password=${SPRING_ADMIN_PASSWORD}
admin.seeding.enabled=true