[changelog]
header = """
# Registro de Alterações

Todas as mudanças notáveis neste serviço serão documentadas neste arquivo.
"""

body = """{% if version %}## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%d/%m/%Y") }}{% else %}## Não Lançado{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/WenFra005/javaEcommerce/commit/{{ commit.id }}) {{ commit.message | upper_first }}{% if commit.breaking %} **(BREAKING)**{% endif %}
{% endfor %}
{% endfor %}
"""

footer = """
<!-- Gerado automaticamente pelo git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
sort_commits = "newest"
tag_pattern = "v[0-9]*"

commit_parsers = [
    { message = "^feat", group = "Funcionalidades" },
    { message = "^fix", group = "Correções" },
    { message = "^docs", group = "Documentação" },
    { message = "^perf", group = "Desempenho" },
    { message = "^refactor", group = "Refatoração" },
    { message = "^style", group = "Estilo" },
    { message = "^test", group = "Testes" },
    { message = "^chore", group = "Tarefas" },
    { message = "^revert", group = "Reversões" },
    { message = "^ci", group = "Integração Contínua" },
    { message = "^build", group = "Build" },
    { message = ".*", group = "Outras Alterações" },
]

link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/WenFra005/javaEcommerce/issues/$1" },
]
