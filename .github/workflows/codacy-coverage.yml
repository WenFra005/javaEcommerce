name: Codacy coverage

on: 
  push: 
    branches:
      - "dev"
      - "main"
    paths:
      - "user-service/**"
      - ".codacy.yml"
      - ".github/workflows/codacy-coverage.yml"
  pull_request:
    branches:
      - "dev" 
      - "main"
    paths:
      - "user-service/**"
      - ".codacy.yml"
      - ".github/workflows/codacy-coverage.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  coverage_report:
    name: Test & Report Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with coverage
        working-directory: user-service
        run: |
          ./mvnw -B clean test jacoco:report
          report="target/site/jacoco/jacoco.xml"
          if [ ! -s "$report" ]; then
            echo "JaCoCo XML report was not generated."
            exit 1
          fi
          echo "JaCoCo report found: user-service/$report"

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: "user-service/target/site/jacoco/jacoco.xml"
          language: Java
          force-coverage-parser: jacoco
          
