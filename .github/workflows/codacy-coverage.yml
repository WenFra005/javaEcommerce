name: Codacy coverage

on: 
  push: 
    branches:
      - "dev"
      - "main"
    paths: 
      - 'user-service/**'
  pull_request:
    branches:
      - "dev" 
      - "main"
    paths:
      - 'user-service/**'

permissions:
  contents: read

jobs:
  coverage_report:
    name: Test & Report Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with coverage
        run: |
          ./mvnw clean test jacoco:report
          reports=$(find . -type f -path '*/target/site/jacoco/jacoco.xml' -print)
          if [ -z "$reports" ]; then
            echo "JaCoCo XML report was not generated."
            exit 1
          fi
          echo "JaCoCo report(s) found:"
          echo "$reports"

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: "**/target/site/jacoco/jacoco.xml" # Ajuste o caminho conforme seu monorepo
          language: Java
          
