name: Docker publish

on:
  push:
    branches:
      - dev
    paths:
      - "user-service/src**"
      - "user-service/Dockerfile"
      - "user-service/pom.xml"
      - "user-service/.mvn/**"
      - "user-service/mvnw"
      - ".github/workflows/docker-publish.yml"
      
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish user-service image
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define short SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/javaecommerce:user-service-dev
            ${{ secrets.DOCKERHUB_USERNAME }}/javaecommerce:user-service-sha-${{ steps.meta.outputs.sha_short }}
