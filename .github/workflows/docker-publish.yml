name: Docker push
on:
  pull_request:
    branches:
      - dev
    paths:
      - "user-service/**"
      - ".github/workflows/docker-publish.yml"
permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/javaecommerce

jobs:
  build:
    name: Build user-service image
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define short SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:user-service-dev
      - name: Login no Docker Hub
        if: github.event_name == 'pull_request' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push image
        if: github.event_name == 'pull_request' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:user-service-sha-${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:user-service-dev

