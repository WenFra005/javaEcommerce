name: Docker publish

on:
  push:
    branches:
      - dev
      - main

    tags:
      - 'v*.*.*'
    paths:
      - "user-service/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: 
      
permissions:
  contents: read

concurrency: 
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: javaecommerce/user-service

jobs:
  publish_development:
    name: Publish development image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define short SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_DEV }}
      
      - name: Build and push development image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: | 
            ${{ env.IMAGE_NAME }}:user-service-dev
            ${{ env.IMAGE_NAME }}:user-service-sha-${{ steps.meta.outputs.sha_short }}

  publish_staging:
    name: Publish staging image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define short SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_STAG }}
      
      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: | 
            ${{ env.IMAGE_NAME }}:user-service-staging
            ${{ env.IMAGE_NAME }}:user-service-sha-${{ steps.meta.outputs.sha_short }}

  publish_production:
    name: Publish production image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define short SHA
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PROD }}
      
      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: | 
            ${{ env.IMAGE_NAME }}:user-service-${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:user-service-prod