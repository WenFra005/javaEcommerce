name: Docker publish production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-publish-production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/javaecommerce

jobs:
  publish_production:
    name: Publish production image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define release metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha_short="$(git rev-parse --short HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PROD }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: ./user-service
          file: ./user-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:user-service-${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:user-service-prod
            ${{ env.IMAGE_NAME }}:user-service-sha-${{ steps.meta.outputs.sha_short }}
